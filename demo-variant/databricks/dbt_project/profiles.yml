# Written for dbt-databricks (1.x) and dbt v2 alike: same keys.
# The notebook generates its own copy of this file from the widgets.
demo_variant:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DBT_HOST') }}"
      http_path: "{{ env_var('DBT_HTTP_PATH') }}"
      token: "{{ env_var('DBT_TOKEN') }}"
      catalog: "{{ env_var('USERS_CATALOG', 'demo_users') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'marts') }}"
      threads: 4
