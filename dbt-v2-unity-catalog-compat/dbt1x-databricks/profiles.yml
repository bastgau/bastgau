# dbt-core 1.x + dbt-databricks, same workspace as the v2 protocol, separate schema.
uc_compat_v1:
  target: live
  outputs:
    live:
      type: databricks
      host: "{{ env_var('DBT_HOST') }}"
      http_path: "{{ env_var('DBT_HTTP_PATH') }}"
      token: "{{ env_var('DBT_TOKEN') }}"
      catalog: "{{ env_var('DBT_CATALOG', 'main') }}"
      schema: "{{ env_var('DBT_SCHEMA_V1', 'dbt_uc_compat_v1') }}"
      threads: 4
