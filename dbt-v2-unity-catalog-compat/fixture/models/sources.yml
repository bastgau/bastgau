sources:
  - name: bronze
    catalog: "{{ env_var('DBT_SOURCE_CATALOG', 'raw_prod') }}" # UC catalog on the source
    schema: "{{ env_var('DBT_SOURCE_SCHEMA', 'crm') }}"
    tables:
      - name: "{{ env_var('DBT_SOURCE_TABLE', 'customers') }}"
        identifier: "{{ env_var('DBT_SOURCE_TABLE', 'customers') }}"
        config: # dbt v2: freshness/loaded_at_field live under `config`
          loaded_at_field: "{{ env_var('DBT_SOURCE_TS_COLUMN', '_ingested_at') }}"
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
